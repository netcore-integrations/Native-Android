plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.netcore.smarttechdemo"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
            HANSEL_APP_ID : localProps.getProperty('HANSEL_APP_ID', ''),
            HANSEL_APP_KEY: localProps.getProperty('HANSEL_APP_KEY', ''),
            SMT_APP_ID    : localProps.getProperty('SMT_APP_ID', '')
        ]

        buildConfigField "String", "SMARTECH_SDK_VERSION",   '"3.7.6"'
        buildConfigField "String", "SMARTECH_PUSH_VERSION",  '"3.5.13"'
        buildConfigField "String", "SMARTECH_INBOX_VERSION", '"3.5.4"'
        buildConfigField "String", "SMARTECH_NUDGES_VERSION",'"10.2.11"'

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


  
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.netcore.smarttechdemo'
    buildFeatures {
        viewBinding true
        buildConfig true
    }

}






dependencies {

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:core:1.5.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    //smart tech




    implementation 'com.netcore.android:smartech-sdk:3.7.6'
    implementation 'com.netcore.android:smartech-push:3.5.13'
    implementation 'com.netcore.android:smartech-appinbox:3.5.4'
    implementation 'com.netcore.android:smartech-nudges:10.2.11'
    implementation platform('com.google.firebase:firebase-bom:28.4.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // add retrofit dependency
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    // gson
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // picasso for loading images in my Image View
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'


}