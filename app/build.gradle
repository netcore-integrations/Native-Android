plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.netcore.smarttechdemo"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SMARTECH_SDK_VERSION",   '"3.8.2"'
        buildConfigField "String", "SMARTECH_PUSH_VERSION",  '"3.8.2"'
        buildConfigField "String", "SMARTECH_INBOX_VERSION", '"3.8.0"'
        buildConfigField "String", "SMARTECH_NUDGES_VERSION",'"10.3.1"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


  
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace 'com.netcore.smarttechdemo'
    buildFeatures {
        viewBinding true
        buildConfig true
    }

}






dependencies {

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    //smart tech
    implementation 'com.netcore.android:smartech-sdk:3.8.2'
    implementation 'com.netcore.android:smartech-push:3.8.2'
    implementation 'com.netcore.android:smartech-appinbox:3.8.0'
    implementation 'com.netcore.android:smartech-nudges:10.3.1'
    implementation platform('com.google.firebase:firebase-bom:34.13.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // add retrofit dependency
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'

    // gson
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // picasso for loading images in my Image View
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'


}